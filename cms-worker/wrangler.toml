name = "inner-athlete-store-manager"
main = "worker.js"
compatibility_date = "2024-09-23"

[vars]
GITHUB_OWNER = "nilan92"
GITHUB_REPO = "inner-athlete-website"
GITHUB_BRANCH = "main"
# The origin the /admin page is served from. Responses are only ever sent here.
ALLOWED_ORIGIN = "https://www.innerathleteactive.com"

# Secrets — never put these here. Set each one with:
#   wrangler secret put ADMIN_USERNAME
#   wrangler secret put ADMIN_PASSWORD
#   wrangler secret put SESSION_SECRET
#   wrangler secret put GITHUB_TOKEN
# See README.md for how to obtain/generate each value.
