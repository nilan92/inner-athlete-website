backend:
  name: github
  repo: nilan92/inner-athlete-website
  branch: main
  # OAuth proxy (Cloudflare Worker) that lets the client log in with GitHub.
  # See cms-oauth-worker/README.md for setup instructions. Replace the URL
  # below with your deployed Worker's URL once it's live.
  base_url: https://inner-athlete-cms-auth.YOUR-SUBDOMAIN.workers.dev
  auth_endpoint: auth

# Every change made in the CMS is committed straight to the `main` branch,
# which triggers the existing GitHub Action (build content -> minify -> deploy).
publish_mode: simple

media_folder: "img/products"
public_folder: "/img/products"

collections:
  - name: "products"
    label: "Products"
    label_singular: "Product"
    description: "Products shown in the shop. Adding, editing, or removing a product here automatically updates the site, the SEO data, and the search-engine listings on the next deploy (usually within a couple of minutes)."
    folder: "content/products"
    create: true
    delete: true
    slug: "{{fields.id}}-{{fields.slug}}"
    summary: "{{name}} — {{fields.markets}}"
    fields:
      - label: "Product ID"
        name: "id"
        widget: "number"
        value_type: "int"
        hint: "A unique number. Never reuse an ID from a deleted product."
      - label: "Product Name"
        name: "name"
        widget: "string"
      - label: "URL Slug"
        name: "slug"
        widget: "string"
        hint: "Lowercase, dashes only, e.g. longline-active-top. Used internally and for SEO — avoid changing it after publishing."
      - label: "SKU"
        name: "sku"
        widget: "string"
        hint: "Internal stock-keeping code, e.g. IA-TOP-002"
      - label: "Description (used for SEO & search engines)"
        name: "description"
        widget: "text"
        hint: "A clear 1–2 sentence description. This is what shows up in Google search results, so make it descriptive."
      - label: "Price — Rest of World (USD)"
        name: "priceUSD"
        widget: "number"
        value_type: "float"
      - label: "Price — Sri Lanka (LKR)"
        name: "priceLKR"
        widget: "number"
        value_type: "float"
      - label: "Price — Maldives (MVR)"
        name: "priceMVR"
        widget: "number"
        value_type: "float"
      - label: "Available Sizes"
        name: "sizes"
        widget: "select"
        multiple: true
        required: false
        default: ["S", "M", "L", "XL"]
        options: ["XS", "S", "M", "L", "XL", "XXL"]
        hint: "Leave empty if this product has no size selector (e.g. a hijab)."
      - label: "Markets — where should this product be sold?"
        name: "markets"
        widget: "select"
        multiple: true
        default: ["US", "LK", "MV"]
        options:
          - { label: "Rest of World (USD)", value: "US" }
          - { label: "Sri Lanka (LKR)", value: "LK" }
          - { label: "Maldives (MVR)", value: "MV" }
        hint: "Untick a market to hide this product from customers there (e.g. untick Maldives if it can't be shipped there yet)."
      - label: "Colors & Photos"
        name: "colors"
        widget: "list"
        summary: "{{fields.name}}"
        fields:
          - { label: "Color Name", name: "name", widget: "string" }
          - { label: "Swatch Color", name: "hex", widget: "color", enableAlpha: false }
          - label: "Photo — Mobile (portrait crop)"
            name: "imgMobile"
            widget: "image"
            hint: "Upload a portrait/square photo for phone screens."
          - label: "Photo — Desktop (landscape crop)"
            name: "imgDesktop"
            widget: "image"
            hint: "Upload a wider landscape photo for desktop screens."

  - name: "size_chart"
    label: "Size Chart"
    description: "The size guide table shown to customers in the size guide popup."
    files:
      - name: "chart"
        label: "Size Chart"
        file: "content/size-chart.json"
        fields:
          - label: "Sizes"
            name: "rows"
            widget: "list"
            summary: "{{fields.size}}"
            fields:
              - { label: "Size", name: "size", widget: "string" }
              - { label: "Shoulder (in)", name: "shoulder", widget: "string" }
              - { label: "Chest (in)", name: "chest", widget: "string" }
              - { label: "Length (in)", name: "length", widget: "string" }
