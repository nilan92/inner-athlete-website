name = "inner-athlete-cms-auth"
main = "worker.js"
compatibility_date = "2024-09-23"

# The origin your /admin page is served from. Used so the OAuth result page
# only ever messages back to your own site.
[vars]
ALLOWED_ORIGIN = "https://www.innerathleteactive.com"

# Secrets (do NOT put these here — set them with the commands below):
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
